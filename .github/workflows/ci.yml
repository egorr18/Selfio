name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  go-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go fmt check
        run: |
          test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Build server
        run: go build -o app ./cmd/server

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: selfio_db
          POSTGRES_USER: selfio
          POSTGRES_PASSWORD: selfio_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfio -d selfio_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: selfio_pass
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U selfio -d selfio_db && exit 0
            sleep 1
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Apply migrations (*.sql)
        env:
          PGPASSWORD: selfio_pass
        run: |
          ls -la migrations || true
          for f in $(ls -1 migrations/*.sql | sort); do
            echo "Applying $f"
            psql -h localhost -p 5432 -U selfio -d selfio_db -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Smoke check schema
        env:
          PGPASSWORD: selfio_pass
        run: |
          psql -h localhost -p 5432 -U selfio -d selfio_db -c "\dt"
          psql -h localhost -p 5432 -U selfio -d selfio_db -c "SELECT COUNT(*) FROM users;"

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selfio</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://egorr18.github.io/Selfio/" />
  <meta name="google-site-verification" content="mH_wzHWTUwJh876jYjpO4eNiBFmTVstHc802VMw8aAU" />

  <script>
    (function () {
      const saved = localStorage.getItem("selfio_lang"); // "en" | "uk"
      if (saved === "en") location.replace("en/pages/index.html");
      if (saved === "uk") location.replace("uk/pages/index.html");
    })();
  </script>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .langPick{min-height:100vh;display:grid;place-items:center;padding:24px}
    .langCard{max-width:520px;width:100%;border:1px solid rgba(0,0,0,.12);border-radius:16px;padding:18px}
    .langBtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    .langBtns a{flex:1}
  </style>
</head>
<body>
  <main class="langPick">
    <div class="langCard">
      <h1 style="margin:0 0 8px;">Choose language</h1>
      <p class="mini" style="margin:0;">Select your language. You can change it later.</p>

      <div class="langBtns">
        <a class="btn btn--primary" href="en/pages/index.html" data-lang="en">English</a>
        <a class="btn btn--secondary" href="uk/pages/index.html" data-lang="uk">Українська</a>
      </div>
    </div>
  </main>

  <script>
    document.querySelectorAll("[data-lang]").forEach(a=>{
      a.addEventListener("click", () => localStorage.setItem("selfio_lang", a.dataset.lang));
    });
  </script>
</body>
</html>

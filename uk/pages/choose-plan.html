  <link rel="alternate" hreflang="uk" href="https://egorr18.github.io/Selfio/uk/pages/choose-plan.html" />

<body data-app data-page="choose-plan">

<header class="header">
  <div class="container header__inner">
    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible" aria-label="Primary">
        <a href="app.html">Сьогодні</a>
        <a href="weekly.html">Тиждень</a>
        <a href="habits.html">Звички</a>
        <a href="account.html">Акаунт</a>
      </nav>

      <div class="header__actions header__actions--app">
        <span class="link" data-app-meta>—</span>

        <div class="lang-switch">
          <a class="lang-link" href="../../en/pages/choose-plan.html" data-lang="en" aria-label="Switch to English">EN</a>
          <span aria-hidden="true">/</span>
          <a class="lang-link" href="choose-plan.html" data-lang="uk" aria-label="Перемкнути на українську">UA</a>
        </div>

        <button class="theme-toggle" type="button"
                data-theme-toggle
                aria-label="Toggle theme"
                aria-pressed="false">🌙</button>

        <button class="btn btn--secondary" type="button" data-logout>Вийти</button>
      </div>
    </div>
  </div>
</header>

<main class="app" role="main">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Оберіть свій план</h1>
        <p>Оберіть зараз — пізніше можна змінити в “Акаунт”.</p>
      </div>

      <div class="chooseplan__topright">
        <button class="btn btn--ghost" type="button" data-back>Назад</button>
      </div>
    </div>

    <div class="app__grid chooseplan__grid">
      <div class="card">
        <h2 class="chooseplan__heading">Плани</h2>
        <p class="mini chooseplan__subtitle">
          Free — зручно, щоб почати. Pro відкриває планування наперед. Premium додає шаблони + щомісячні інсайти.
        </p>

        <div class="row chooseplan__plans">
          <button class="card chooseplan__plan" type="button" data-plan="free">
            <div class="chooseplan__planTop">
              <div class="chooseplan__planInfo">
                <h3 class="chooseplan__planTitle">Free</h3>
                <div class="mini">Щоденний чек-ін + завдання + звички</div>
              </div>
              <div class="chooseplan__price">
                <div class="chooseplan__priceValue">$0</div>
                <div class="mini chooseplan__priceUnit">/місяць</div>
              </div>
            </div>
            <div class="mini chooseplan__bullet">• До 5 завдань/день</div>
            <div class="mini">• Без планування наперед</div>
          </button>

          <button class="card chooseplan__plan" type="button" data-plan="pro">
            <div class="chooseplan__planTop">
              <div class="chooseplan__planInfo">
                <h3 class="chooseplan__planTitle">Pro</h3>
                <div class="mini">План тижня + перенесення цілей у “Сьогодні”</div>
              </div>
              <div class="chooseplan__price">
                <div class="chooseplan__priceValue">$4.99</div>
                <div class="mini chooseplan__priceUnit">/місяць</div>
              </div>
            </div>
            <div class="mini chooseplan__bullet">• Цей тиждень + наступні 2 тижні</div>
            <div class="mini">• До 10 завдань/день</div>
          </button>

          <button class="card chooseplan__plan" type="button" data-plan="premium">
            <div class="chooseplan__planTop">
              <div class="chooseplan__planInfo">
                <h3 class="chooseplan__planTitle">Premium</h3>
                <div class="mini">Шаблони + інсайти за місяць</div>
              </div>
              <div class="chooseplan__price">
                <div class="chooseplan__priceValue">$9.99</div>
                <div class="mini chooseplan__priceUnit">/місяць</div>
              </div>
            </div>
            <div class="mini chooseplan__bullet">• До 8 тижнів наперед</div>
            <div class="mini">• До 15 завдань/день</div>
          </button>
        </div>

        <div class="mini" data-plan-toast style="display:none; margin-top:10px;"></div>
      </div>
    </div>
  </div>
</main>

<script>
  document.querySelectorAll(".lang-link").forEach(a => {
    a.addEventListener("click", () => localStorage.setItem("selfio_lang", a.dataset.lang));
  });
</script>
</body>
</html>

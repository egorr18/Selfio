  <meta name="description" content="Створи короткий список звичок і відмічай його щодня." />

  <link rel="icon" href="../../images/favicon.ico" />

  <link rel="canonical" href="https://egorr18.github.io/Selfio/uk/pages/habits.html" />
  <link rel="alternate" hreflang="en" href="https://egorr18.github.io/Selfio/en/pages/habits.html" />
  <link rel="alternate" hreflang="uk" href="https://egorr18.github.io/Selfio/uk/pages/habits.html" />
  <link rel="alternate" hreflang="x-default" href="https://egorr18.github.io/Selfio/" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EZM00G7BDP"></script>
  
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EZM00G7BDP');

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" />

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/app.css" />

  <script src="../../js/core/bootstrap.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer crossorigin></script>

  <script src="../../js/core/config.js" defer></script>
  <script src="../../js/cloud/supabase.js" defer></script>
  <script src="../../js/core/auth.js" defer></script>
  <script src="../../js/core/store.js" defer></script>

  <script src="../../js/nav.js" defer></script>
  <script src="../../js/theme.js" defer></script>
  <script src="../../js/app.js" defer></script>
</head>


<body data-app data-page="habits">

<header class="header">
  <div class="container header__inner">
    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible" aria-label="Primary">
        <a href="app.html">Сьогодні</a>
        <a href="weekly.html">Тиждень</a>
        <a href="habits.html" class="is-active" aria-current="page">Звички</a>
        <a href="account.html">Акаунт</a>
      </nav>

      <div class="header__actions header__actions--app">
        <button class="theme-toggle" type="button"
                data-theme-toggle
                aria-label="Toggle theme"
                aria-pressed="false">🌙</button>

        <div class="lang-switch">
          <a class="lang-link" href="../../en/pages/habits.html" data-lang="en" aria-label="Switch to English">EN</a>
          <span aria-hidden="true">/</span>
          <a class="lang-link" href="habits.html" data-lang="uk" aria-label="Перемкнути на українську">UA</a>
        </div>

        <span class="link" data-app-meta>—</span>
      </div>
    </div>
  </div>
</header>

<main class="app" role="main">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Звички</h1>
      </div>
    </div>

    <section class="card" aria-label="Habits">
      <h2>Мої звички (сьогодні)</h2>

      <div class="stack">
        <div class="mini"><b>Цілі цього тижня</b></div>
        <div class="mini" data-weekgoals-preview>—</div>
        <a class="pill" href="weekly.html">Редагувати в “Тиждень”</a>
      </div>

      <div class="row mt-12">
        <label class="sr-only" for="habit-input">Нова звичка</label>
        <input id="habit-input" class="text" data-habit-input
               placeholder="Нова звичка (наприклад: 30 хв навчання)"
               aria-label="Нова звичка" />
        <button class="btn btn--primary" type="button" data-habit-add>Додати</button>
      </div>

      <div class="list mt-12" data-habits-list></div>

      <div class="actions">
        <a class="btn btn--secondary" href="app.html">Назад до “Сьогодні”</a>
        <a class="btn btn--secondary" href="weekly.html">Тиждень</a>
      </div>
    </section>
  </div>
</main>
<script>
  document.querySelectorAll(".lang-link").forEach(a => {
    a.addEventListener("click", () => localStorage.setItem("selfio_lang", a.dataset.lang));
  });
</script>
</body>
</html>

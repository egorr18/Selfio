<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Тиждень — Selfio</title>
  <meta name="description" content="Тижневий планер: завдання + звички, просто і зручно." />

  <link rel="icon" href="../../images/favicon.ico" />
  <link rel="canonical" href="https://egorr18.github.io/Selfio/uk/pages/weekly.html" />
  <link rel="alternate" hreflang="en" href="https://egorr18.github.io/Selfio/en/pages/weekly.html" />
  <link rel="alternate" hreflang="uk" href="https://egorr18.github.io/Selfio/uk/pages/weekly.html" />
  <link rel="alternate" hreflang="x-default" href="https://egorr18.github.io/Selfio/" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" />

  <script src="../../js/core/bootstrap.js" defer></script>

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/app.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer crossorigin></script>
</head>

<body data-app data-page="weekly">
<header class="header">
  <div class="container header__inner">
    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible" aria-label="Primary">
        <a href="app.html">Сьогодні</a>
        <a href="weekly.html" class="is-active" aria-current="page">Тиждень</a>
        <a href="habits.html">Звички</a>
        <a href="account.html">Акаунт</a>
      </nav>

      <div class="header__actions header__actions--app">
        <button class="theme-toggle" type="button"
                data-theme-toggle
                aria-label="Toggle theme"
                aria-pressed="false">🌙</button>

        <div class="lang-switch">
          <a class="lang-link" href="../../en/pages/weekly.html" data-lang="en" aria-label="Switch to English">EN</a>
          <span aria-hidden="true">/</span>
          <a class="lang-link" href="weekly.html" data-lang="uk" aria-label="Перемкнути на українську">UA</a>
        </div>

        <span class="link" data-app-meta>—</span>
      </div>
    </div>
  </div>
</header>

<main class="app" role="main">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Тиждень</h1>
      </div>
    </div>

    <!-- Insights -->
    <div class="card" data-insights-card>
      <div class="inline inline--between" style="margin-bottom:10px;">
        <h2 style="margin:0;">Інсайти</h2>

        <div class="inline" data-insights-tabs>
          <button class="pill" type="button" data-insights-tab="week">Тиждень</button>
          <button class="pill" type="button" data-insights-tab="month">Місяць</button>
        </div>
      </div>

      <div class="mini" data-weekly-lines>—</div>
      <div class="mini" data-monthly-lines style="display:none;">—</div>
    </div>

    <!-- Week plan -->
    <div class="card weekplan" data-weekplan style="margin-top:12px;">
      <div class="weekplan__head">
        <div>
          <h2 style="margin:0;">План тижня</h2>
          <div class="mini weekplan__range" data-weekplan-range>—</div>
        </div>

        <div class="weekplan__actions">
          <button class="pill" type="button" data-weekplan-prev>Назад</button>
          <button class="pill" type="button" data-weekplan-today>Цей тиждень</button>
          <button class="pill" type="button" data-weekplan-next>Далі</button>
        </div>
      </div>

      <div class="mini weekplan__hint" data-weekplan-hint></div>
      <div class="mini weekplan__locked" data-weekplan-locked style="display:none;">
        <b>Тільки Pro.</b> Оновіться до PRO, щоб планувати тижні наперед.
      </div>

      <!-- Premium tools -->
      <div class="weekplan__tools">
        <select
          id="weekplanTemplate"
          name="weekplanTemplate"
          class="weekplan__select"
          data-weekplan-template
          aria-label="Шаблон плану тижня"
        >
          <option value="study">Навчальний спринт</option>
        </select>

        <button class="pill" type="button" data-weekplan-template-apply>Застосувати шаблон</button>
        <button class="pill" type="button" data-weekplan-clear>Очистити</button>
      </div>

      <div class="weekplan__fields" data-weekplan-fields>
        <div class="weekplan__goals" data-week-goals></div>

        <div class="weekplan__goal-actions">
          <button class="btn btn--ghost btn--sm" type="button" data-week-goal-add>+ Додати ціль</button>
          <span class="mini" data-week-goal-limit></span>
        </div>

        <div class="item">
          <textarea
            id="weekplanNote"
            name="weekplanNote"
            class="weekplan__note"
            placeholder="Нотатка на тиждень (необов’язково)"
            data-week-note
            aria-label="Нотатка на тиждень"
          ></textarea>
        </div>
      </div>

      <div class="weekplan__footer">
        <div class="weekplan__copy">
          <select
            id="weekplanCopyWeeks"
            name="weekplanCopyWeeks"
            class="weekplan__select"
            data-weekplan-copy-weeks
            aria-label="Копіювати вперед на тижні"
          >
            <option value="1">+1 тиждень</option>
          </select>
          <button class="btn" type="button" data-weekplan-copy>Копіювати вперед</button>
        </div>

        <span class="mini weekplan__toast" data-weekplan-toast style="display:none;"></span>
      </div>
    </div>

    <div class="week" data-week style="margin-top:12px;"></div>
  </div>
</main>

<script>
  document.querySelectorAll(".lang-link").forEach(a => {
    a.addEventListener("click", () => localStorage.setItem("selfio_lang", a.dataset.lang));
  });
</script>

<script src="../../js/core/config.js" defer></script>
<script src="../../js/cloud/supabase.js" defer></script>
<script src="../../js/core/auth.js" defer></script>
<script src="../../js/core/store.js" defer></script>

<script src="../../js/nav.js" defer></script>
<script src="../../js/theme.js" defer></script>
<script src="../../js/app.js" defer></script>
</body>
</html>

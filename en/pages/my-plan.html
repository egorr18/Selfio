<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>My plan — Selfio</title>

  <link rel="icon" href="../../images/favicon.ico" />
  <link rel="canonical" href="https://egorr18.github.io/Selfio/en/pages/my-plan.html" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" />

  <script src="../../js/core/bootstrap.js" defer></script>

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/app.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer crossorigin></script>
</head>

<body data-app data-page="my-plan">
<header class="header">
  <div class="container header__inner">
    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible" aria-label="Primary">
        <a href="app.html">Today</a>
        <a href="weekly.html">Weekly</a>
        <a href="habits.html">Habits</a>
        <a href="account.html">Account</a>
      </nav>

      <div class="header__actions header__actions--app">
        <button class="theme-toggle" type="button"
                data-theme-toggle
                aria-label="Toggle theme"
                aria-pressed="false">🌙
        </button>
        <div class="lang-switch">
          <a class="lang-link" href="my-plan.html" data-lang="en" aria-label="Switch to English">EN</a>
          <span aria-hidden="true">/</span>
          <a class="lang-link" href="../../uk/pages/my-plan.html" data-lang="uk" aria-label="Перемкнути на українську">UA</a>
        </div>
        <span class="link" data-app-meta>—</span>
      </div>
    </div>
  </div>
</header>

<main class="app" role="main">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Your plan</h1>
        <p>This page shows only the plan you’re currently using.</p>
      </div>

      <div class="chooseplan__topright">
        <button class="btn btn--ghost" type="button" data-back>Back</button>
      </div>
    </div>

    <div class="myplan__grid">
      <div class="card">
        <h2>Account</h2>
        <div class="mini">Email: <b data-my-email>—</b></div>
        <div class="mini" style="margin-top:6px;">Plan: <b data-my-plan>—</b></div>
      </div>

      <div class="card myplan__card">
        <div class="myplan__badge" data-plan-badge>—</div>
        <h2 class="myplan__name" data-plan-name>—</h2>
        <div class="myplan__price" data-plan-price>—</div>
        <p class="myplan__desc" data-plan-desc>—</p>
        <ul class="myplan__features" data-plan-features></ul>
      </div>
    </div>
  </div>
</main>

<script src="../../js/core/config.js" defer></script>
<script src="../../js/cloud/supabase.js" defer></script>
<script src="../../js/core/auth.js" defer></script>
<script src="../../js/core/store.js" defer></script>

<script src="../../js/nav.js" defer></script>
<script src="../../js/theme.js" defer></script>
<script src="../../js/my-plan.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Today — Selfio</title>
  <meta name="description" content="Your daily check-in: focus, tasks, habits — in 2 minutes." />

  <link rel="icon" href="../images/favicon.ico" />
  <link rel="canonical" href="https://egorr18.github.io/Selfio/pages/app.html" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" />

  <script src="../js/core/bootstrap.js" defer></script>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/app.css" />

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    defer
    crossorigin
  ></script>
</head>

<body data-app data-page="today">

<header class="header">
  <div class="container header__inner">
    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible" aria-label="Primary">
        <a href="app.html" class="is-active" aria-current="page">Today</a>
        <a href="weekly.html">Weekly</a>
        <a href="habits.html">Habits</a>
        <a href="account.html">Account</a>
      </nav>

      <div class="header__actions header__actions--app">
        <button class="theme-toggle" type="button"
                data-theme-toggle
                aria-label="Toggle theme"
                aria-pressed="false">🌙</button>
        <span class="link" data-app-meta>—</span>
      </div>
    </div>
  </div>
</header>

<main class="app" id="main" role="main">
  <div class="container">

    <div class="app__top">
      <div class="app__title">
        <h1>Today</h1>
      </div>
    </div>

    <div class="app__grid">

      <!-- LEFT COLUMN -->
      <section class="card" aria-label="Daily check-in">
        <h2>Check-in (30 seconds)</h2>

        <!-- Week mini -->
        <div class="weekmini" data-weekmini style="margin-top:10px;">
          <div class="inline inline--between" style="gap:10px; flex-wrap:wrap;">
            <div>
              <div class="mini"><b>This week plan</b></div>
              <div class="mini" data-weekmini-range>—</div>
            </div>
            <a class="pill" href="weekly.html">Open</a>
          </div>

          <div class="mini" data-weekmini-locked style="display:none; margin-top:8px;">
            <b>PRO feature.</b> Plan weeks ahead + push goals to Today.
          </div>

          <div data-weekmini-body style="margin-top:8px;">
            <div class="mini" data-weekmini-goals>—</div>

            <div class="inline" style="margin-top:10px; gap:10px; flex-wrap:wrap;">
              <button class="btn btn--primary btn--sm" type="button" data-weekmini-push>
                Push goals to Today
              </button>
              <span class="mini" data-weekmini-toast style="display:none;"></span>
            </div>
          </div>
        </div>

        <!-- Mood + Focus -->
        <div class="row" style="margin-top:14px;">
          <div aria-label="Mood">
            <div class="mini" id="moodLabel">Mood</div>
            <div class="mood" style="margin-top:8px;" aria-labelledby="moodLabel">
              <button type="button" data-mood="1" aria-label="Mood 1 (very bad)">😣</button>
              <button type="button" data-mood="2" aria-label="Mood 2 (bad)">😕</button>
              <button type="button" data-mood="3" aria-label="Mood 3 (neutral)">😐</button>
              <button type="button" data-mood="4" aria-label="Mood 4 (good)">🙂</button>
              <button type="button" data-mood="5" aria-label="Mood 5 (great)">😁</button>
            </div>
          </div>

          <div>
            <label class="mini" for="focusSelect">Focus today</label>
            <select id="focusSelect" class="select" data-focus style="margin-top:8px;"></select>

            <div class="inline" style="margin-top:8px;">
              <label class="sr-only" for="focusNew">Add a new focus</label>
              <input id="focusNew" class="text text--sm" data-focus-new placeholder="Add your focus (e.g. Exams)" />
              <button class="btn btn--ghost btn--sm" type="button" data-focus-add>Add</button>
            </div>
          </div>
        </div>

        <!-- Tasks -->
        <div style="margin-top:14px;">
          <div class="inline inline--between">
            <div class="mini">Tasks</div>

            <div class="inline">
              <label class="mini" for="tasksCount">Per day</label>
              <select id="tasksCount" class="select select--sm" data-tasks-count></select>
            </div>
          </div>

          <div class="mini" data-tasks-progress style="margin-top:8px;" aria-live="polite">
            Tasks: 0/0 (0%)
          </div>

          <div class="progress" style="margin-top:8px;" aria-hidden="true">
            <span data-tasks-bar></span>
          </div>

          <div class="list" data-tasks style="margin-top:10px;"></div>

          <!-- Quick add -->
          <div class="quickAddRow">
            <label class="sr-only" for="quickTask">Quick add task</label>
            <input id="quickTask" class="text text--sm" data-quick-task placeholder="Quick add task..." />

            <label class="sr-only" for="quickWhen">When</label>
            <select id="quickWhen" class="select select--sm" data-quick-when>
              <option value="0">Today</option>
              <option value="1">Tomorrow</option>
              <option value="2">+2 days</option>
            </select>

            <button class="btn btn--primary btn--sm" type="button" data-quick-add>Add</button>
          </div>

          <div class="mini" data-quick-toast style="display:none; margin-top:8px;"></div>
        </div>

        <!-- Note -->
        <div style="margin-top:14px;">
          <label class="mini" for="noteInput">1 sentence (optional)</label>
          <input id="noteInput" class="text" data-note placeholder="What matters today?" style="margin-top:8px;" />
        </div>

        <div class="actionsRow">
          <a class="btn btn--secondary" href="weekly.html">Open weekly</a>
          <button class="btn btn--ghost" type="button" data-carry-tomorrow>Move undone → tomorrow</button>
          <button class="btn btn--ghost" type="button" data-reset-today>Reset today</button>
        </div>
      </section>

      <!-- RIGHT COLUMN -->
      <aside class="card" aria-label="Habits">
        <h2>Habits (tap & done)</h2>
        <div class="mini">Edit names прямо тут. Список береться з Today.</div>

        <div class="list" data-habits style="margin-top:10px;"></div>

        <div class="actionsRow">
          <a class="btn btn--primary" href="habits.html">Manage habits</a>
          <a class="btn btn--secondary" href="settings.html">Settings</a>
        </div>
      </aside>

    </div>
  </div>
</main>

<script src="../js/core/config.js" defer></script>
<script src="../js/cloud/supabase.js" defer></script>
<script src="../js/core/store.js" defer></script>

<script src="../js/app.js" defer></script>
<script src="../js/nav.js" defer></script>
<script src="../js/theme.js" defer></script>
<script src="../js/api.js" defer></script>
</body>
</html>

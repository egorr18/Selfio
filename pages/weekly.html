<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly — Selfio</title>
  <meta name="description" content="Weekly planner: tasks + habits, simple and clean." />

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/app.css">
</head>

<body data-app data-page="weekly">

<header class="header">
  <div class="container header__inner">
    <a href="../index.html" class="logo">Selfio</a>

    <nav class="nav">
      <a href="app.html">Today</a>
      <a href="weekly.html" class="active">Weekly</a>
      <a href="habits.html">Habits</a>
      <a href="settings.html">Settings</a>
    </nav>

    <div class="header__actions">
      <span class="link" data-app-meta>—</span>
      <button class="btn btn--secondary" type="button" data-logout>Logout</button>
    </div>
  </div>
</header>

<section class="app">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Weekly</h1>
        <p>Overview for this week. Metrics are based on what you check in Today.</p>
      </div>
    </div>

    <!-- Pro/Premium: week navigation -->
    <div class="inline inline--between" data-week-nav style="margin-bottom:12px;">
      <div class="inline">
        <button class="btn btn--ghost btn--sm" type="button" data-week-prev aria-label="Previous week">←</button>
        <button class="btn btn--ghost btn--sm" type="button" data-week-next aria-label="Next week">→</button>
        <span class="mini" data-week-label>—</span>
      </div>
    </div>

    <!-- Weekly Insights (1–3 короткі рядки) -->
    <div class="card" data-weekly-insights style="margin-bottom:12px;">
      <h2>Weekly Insights</h2>
      <div class="mini" data-weekly-lines>—</div>
    </div>

    <div class="week" data-week></div>
  </div>
</section>

<script src="../js/app.js" defer></script>
</body>
</html>

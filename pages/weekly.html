<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly — Selfio</title>
  <meta name="description" content="Weekly planner: tasks + habits, simple and clean." />

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/app.css">
</head>

<body data-app data-page="weekly">

<header class="header">
  <div class="container header__inner">
    <a href="../index.html" class="logo">Selfio</a>

    <nav class="nav">
      <a href="app.html">Today</a>
      <a href="weekly.html" class="active">Weekly</a>
      <a href="habits.html">Habits</a>
      <a href="settings.html">Settings</a>
    </nav>

    <div class="header__actions">
      <span class="link" data-app-meta>—</span>
      <button class="btn btn--secondary" type="button" data-logout>Logout</button>
    </div>
  </div>
</header>

<section class="app">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Weekly</h1>
        <p>Overview for this week. Metrics are based on what you check in Today.</p>
      </div>
    </div>

    <!-- PRO+ Week Plan card -->
    <div class="card" data-weekplan-card>
      <div class="inline inline--between" style="margin-bottom:10px;">
        <div>
          <h2 style="margin:0;">Week plan</h2>
          <div class="mini" data-week-range>—</div>
        </div>

        <div class="inline" style="gap:8px;">
          <button class="pill" type="button" data-week-prev>Prev</button>
          <button class="pill" type="button" data-week-this>This week</button>
          <button class="pill" type="button" data-week-next>Next</button>
        </div>
      </div>

      <!-- shown only on Free (JS toggles) -->
      <div class="mini" data-weekplan-lock style="display:none; margin-bottom:10px;">
        <b>Pro feature:</b> plan goals for any week + copy plans forward.
      </div>

      <div class="weekplan">
        <div class="item">
          <input type="text" placeholder="Goal #1 (e.g. ship landing page)" data-week-goal="0">
        </div>
        <div class="item">
          <input type="text" placeholder="Goal #2 (e.g. 5 workouts)" data-week-goal="1">
        </div>
        <div class="item">
          <input type="text" placeholder="Goal #3 (e.g. finish 3 lessons)" data-week-goal="2">
        </div>

        <div class="item">
          <textarea rows="3" placeholder="Weekly note (optional)" data-week-note></textarea>
        </div>

        <div class="inline" style="gap:10px; margin-top:8px;">
          <button class="btn btn--secondary" type="button" data-week-copy>
            Copy to next week
          </button>
        </div>
      </div>
    </div>

    <!-- Insights card -->
    <div class="card" data-insights-card style="margin-top:12px;">
      <div class="inline inline--between" style="margin-bottom:10px;">
        <h2 style="margin:0;">Insights</h2>

        <div class="inline" data-insights-tabs>
          <button class="pill" type="button" data-insights-tab="week">Week</button>
          <button class="pill" type="button" data-insights-tab="month">Month</button>
        </div>
      </div>

      <div class="mini" data-weekly-lines>—</div>
      <div class="mini" data-monthly-lines style="display:none;">—</div>
    </div>

    <div class="week" data-week style="margin-top:12px;"></div>
  </div>
</section>

<script src="../js/app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../images/favicon.ico">

  <title>Sign in — Selfio</title>
  <meta name="description" content="Sign in to your Selfio account." />
  <script>
    if (location.hostname.endsWith("github.io") && location.protocol !== "https:") {
      location.replace("https://" + location.host + location.pathname + location.search + location.hash);
    }
  </script>

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pages.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body data-page="signin">

<header class="header">
  <div class="container header__inner">
    <a href="../index.html" class="logo">Selfio</a>

    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible">
        <a href="why-selfio.html">Why Selfio</a>
        <a href="solutions.html">Solutions</a>
        <a href="community.html">Community</a>
        <a href="pricing.html">Pricing</a>
      </nav>

      <div class="header__actions">
        <div class="header__actions">
          <button class="theme-toggle" type="button"
                  data-theme-toggle
                  aria-label="Toggle theme"
                  aria-pressed="false">🌙
          </button>
        <a class="btn" href="signin.html?mode=login">Sign in</a>
        <a class="btn" href="signin.html?mode=register">Create account</a>
      </div>
    </div>
  </div>
  </div>
</header>

<section class="auth">
  <div class="container auth__content">

    <h1 data-auth-title>Welcome back</h1>

    <p class="auth__text" data-auth-text>
      Sign in or create an account to continue your journaling journey.
    </p>

    <!-- Перемикач режиму (НЕ submit) -->
    <div class="auth__switch">
      <button type="button" class="btn btn--primary" data-mode="login">Sign in</button>
      <button type="button" class="btn btn--secondary" data-mode="register">Create account</button>
    </div>

    <form class="auth__form" novalidate>
      <input
              type="email"
              name="email"
              autocomplete="email"
              placeholder="Email address"
              required
      />

      <input
              type="password"
              name="password"
              autocomplete="current-password"
              placeholder="Password"
              required
      />

      <!-- ОДНА submit кнопка -->
      <button type="submit" class="btn btn--primary" data-submit>
        Sign in
      </button>
    </form>

    <p class="auth__note" data-auth-note>
      New here? Select <b>Create account</b>.
    </p>

  </div>
</section>

<footer class="footer">
  <div class="container footer__grid">
    <a class="footer__brand" href="../index.html">Selfio</a>
    <nav class="footer__nav">
      <a href="why-selfio.html">Why Selfio</a>
      <a href="solutions.html">Solutions</a>
      <a href="community.html">Community</a>
      <a href="pricing.html">Pricing</a>
    </nav>
  </div>
</footer>
<script src="../js/core/config.js" defer></script>
<script src="../js/cloud/supabase.js" defer></script>
<script src="../js/core/store.js" defer></script>

<script src="../js/nav.js" defer></script>
<script src="../js/api.js" defer></script>
<script src="../js/sign.js" defer></script>
<script src="../js/theme.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign in — Selfio</title>
  <meta name="description" content="Sign in to your Selfio account." />
  <script>
    if (location.hostname.endsWith("github.io") && location.protocol !== "https:") {
      location.replace("https://" + location.host + location.pathname + location.search + location.hash);
    }
  </script>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>

<body>

<header class="header">
  <div class="container header__inner">
    <a href="../index.html" class="logo">Selfio</a>

    <nav class="nav">
      <a href="why-selfio.html">Why Selfio</a>
      <a href="solutions.html">Solutions</a>
      <a href="community.html">Community</a>
      <a href="pricing.html">Pricing</a>
    </nav>
  </div>
</header>

<section class="auth">
  <div class="container auth__content">

    <h1>Welcome back</h1>

    <p class="auth__text" data-auth-text>
      Sign in or create an account to continue your journaling journey.
    </p>

    <!-- Перемикач режиму (НЕ submit) -->
    <div class="auth__switch">
      <button type="submit" class="btn btn--primary" data-auth="login">Sign in</button>
      <button type="submit" class="btn btn--secondary" data-auth="register">Create account</button>
    </div>

    <form class="auth__form">
      <input
              type="email"
              name="email"
              autocomplete="email"
              placeholder="Email address"
              required
      />

      <input
              type="password"
              name="password"
              placeholder="Password"
              required
      />

      <!-- ОДНА submit кнопка -->
      <button type="submit" class="btn btn--primary" data-submit>
        Sign in
      </button>
    </form>

    <p class="auth__note" data-auth-note>
      New here? Select <b>Create account</b>.
    </p>

  </div>
</section>

<footer class="footer">
  <div class="container footer__grid">
    <div class="footer__brand">Selfio</div>

    <nav class="footer__nav">
      <a href="why-selfio.html">Why Selfio</a>
      <a href="solutions.html">Solutions</a>
      <a href="community.html">Community</a>
      <a href="pricing.html">Pricing</a>
    </nav>
  </div>
</footer>

<script src="../js/sign.js" defer></script>
</body>
</html>

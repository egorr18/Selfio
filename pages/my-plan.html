<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your plan — Selfio</title>
  <meta name="description" content="Your current plan details." />

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/app.css">
</head>

<body data-app data-page="my-plan">

<header class="header">
  <div class="container header__inner">
    <a href="../index.html" class="logo">Selfio</a>

    <nav class="nav">
      <a href="app.html">Today</a>
      <a href="weekly.html">Weekly</a>
      <a href="habits.html">Habits</a>
      <a href="settings.html">Settings</a>
    </nav>

    <div class="header__actions">
      <span class="link" data-app-meta>—</span>
      <button class="btn btn--secondary" type="button" data-logout>Logout</button>
    </div>
  </div>
</header>

<section class="app">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Your plan</h1>
        <p class="mini">This page shows only the plan you’re currently using.</p>
      </div>
      <div class="app__meta" data-plan-badge>—</div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:6px;">
        <span data-plan-name>—</span>
        <span class="mini" style="margin-left:8px;" data-plan-price></span>
      </h2>

      <div class="mini" style="margin-bottom:12px;" data-plan-desc>—</div>

      <ul data-plan-features style="margin: 0; padding-left: 18px;">
        <!-- filled by JS -->
      </ul>

      <div class="actions" style="margin-top:14px;">
        <a class="btn btn--ghost" data-back href="settings.html">Back</a>
      </div>

    </div>

  </div>
</section>
<script src="../js/app.js" defer></script>
</body>
</html>

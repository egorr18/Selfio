<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My plan — Selfio</title>

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/app.css">
</head>

<body data-app data-page="my-plan">

<header class="header">
  <div class="container header__inner">
    <a href="../index.html" class="logo">Selfio</a>

    <nav class="nav">
      <a href="app.html">Today</a>
      <a href="weekly.html">Weekly</a>
      <a href="habits.html">Habits</a>
      <a href="settings.html">Settings</a>
    </nav>

    <div class="header__actions">
      <span class="link" data-app-meta>—</span>
      <button class="btn btn--secondary" type="button" data-logout>Logout</button>
    </div>
  </div>
</header>

<section class="app">
  <div class="container">

    <div class="app__top">
      <div class="app__title">
        <h1>Your plan</h1>
        <p>This page shows only the plan you’re currently using.</p>
      </div>

      <div class="chooseplan__topright">
        <button class="btn btn--ghost" type="button" data-back>Back</button>
      </div>
    </div>

    <div class="myplan__grid">
      <!-- ACCOUNT -->
      <div class="card">
        <h2>Account</h2>
        <div class="mini">Email: <b data-my-email>—</b></div>
        <div class="mini" style="margin-top:6px;">Plan: <b data-my-plan>—</b></div>
      </div>

      <!-- PLAN CARD (як на pricing) -->
      <div class="card myplan__card">
        <div class="myplan__badge" data-plan-badge>—</div>

        <h2 class="myplan__name" data-plan-name>—</h2>
        <div class="myplan__price" data-plan-price>—</div>

        <p class="myplan__desc" data-plan-desc>—</p>

        <ul class="myplan__features" data-plan-features></ul>
      </div>
    </div>

  </div>
</section>

<script src="../js/my-plan.js" defer></script>
</body>
</html>

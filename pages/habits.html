<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow">

  <title>Habits — Selfio</title>
  <meta name="description" content="Create a small list of habits and track it daily." />
  
  <link rel="icon" href="../images/favicon.ico">
  <link rel="canonical" href="https://egorr18.github.io/Selfio/pages/habits.html">
  
  <script src="../js/core/bootstrap.js"></script>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/app.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body data-app data-page="habits">

<header class="header">
  <div class="container header__inner">
    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible" aria-label="Primary">
        <a href="app.html">Today</a>
        <a href="weekly.html">Weekly</a>
        <a href="habits.html">Habits</a>
        <a href="account.html">Account</a>
      </nav>

      <div class="header__actions header__actions--app">
        <button class="theme-toggle" type="button"
                data-theme-toggle
                aria-label="Toggle theme"
                aria-pressed="false">🌙</button>

        <!-- ОЦЕ ОДНЕ ДЖЕРЕЛО ПРАВДИ ДЛЯ ПЛАНА -->
        <span class="link" data-app-meta>—</span>
      </div>
    </div>
  </div>
</header>

<section class="app">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Habits</h1>
      </div>
    </div>

    <div class="card">
      <h2>My habits (today)</h2>

      <div style="margin-top:8px;">
        <div class="mini"><b>This week goals</b></div>
        <div class="mini" data-weekgoals-preview style="margin-top:6px;">—</div>
        <a class="pill" href="weekly.html" style="margin-top:8px; display:inline-block;">Edit in Weekly</a>
      </div>

      <div class="row" style="margin-top:12px;">
        <input class="text" data-habit-input placeholder="New habit (e.g. 30 min study)" />
        <button class="btn btn--primary" type="button" data-habit-add>Add</button>
      </div>

      <div class="list" data-habits-list style="margin-top:12px;"></div>

      <div class="actions">
        <a class="btn btn--secondary" href="app.html">Back to Today</a>
        <a class="btn btn--secondary" href="weekly.html">Weekly</a>
      </div>
    </div>

  </div>
</section>
<script src="../js/core/config.js" defer></script>
<script src="../js/cloud/supabase.js" defer></script>
<script src="../js/core/auth.js" defer></script>
<script src="../js/core/store.js" defer></script>

<script src="../js/nav.js" defer></script>
<script src="../js/theme.js" defer></script>
<script src="../js/app.js" defer></script>
</body>
</html>

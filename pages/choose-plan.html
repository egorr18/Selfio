<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Choose plan — Selfio</title>
  <meta name="description" content="Pick your plan to start using Selfio." />

  <link rel="icon" href="../images/favicon.ico" />
  <link rel="canonical" href="https://egorr18.github.io/Selfio/pages/choose-plan.html" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://duvgdgzbjrkkcxddfpvm.supabase.co" />

  <script src="../js/core/bootstrap.js" defer></script>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/app.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer crossorigin></script>
</head>

<body data-app data-page="choose-plan">

<header class="header">
  <div class="container header__inner">
    <button class="nav-toggle" type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            data-nav-toggle>
      <span></span><span></span><span></span>
    </button>

    <div class="header__drawer" id="site-menu" data-nav-drawer>
      <nav class="nav nav--collapsible" aria-label="Primary">
        <a href="app.html">Today</a>
        <a href="weekly.html">Weekly</a>
        <a href="habits.html">Habits</a>
        <a href="account.html">Account</a>
      </nav>

      <div class="header__actions header__actions--app">
        <span class="link" data-app-meta>—</span>
        <button class="theme-toggle" type="button"
                data-theme-toggle
                aria-label="Toggle theme"
                aria-pressed="false">🌙</button>
        <button class="btn btn--secondary" type="button" data-logout>Logout</button>
      </div>
    </div>
  </div>
</header>

<main class="app" role="main">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Choose your plan</h1>
        <p>Pick one now — you can change it later in Account.</p>
      </div>

      <div class="chooseplan__topright">
        <button class="btn btn--ghost" type="button" data-back>Back</button>
      </div>
    </div>

    <div class="app__grid chooseplan__grid">
      <div class="card">
        <h2 class="chooseplan__heading">Plans</h2>
        <p class="mini chooseplan__subtitle">
          Free is great to start. Pro unlocks planning ahead. Premium adds templates + monthly insights.
        </p>

        <div class="row chooseplan__plans">
          <button class="card chooseplan__plan" type="button" data-plan="free">
            <div class="chooseplan__planTop">
              <div class="chooseplan__planInfo">
                <h3 class="chooseplan__planTitle">Free</h3>
                <div class="mini">Daily check-in + tasks + habits</div>
              </div>
              <div class="chooseplan__price">
                <div class="chooseplan__priceValue">$0</div>
                <div class="mini chooseplan__priceUnit">/month</div>
              </div>
            </div>
            <div class="mini chooseplan__bullet">• Up to 5 tasks/day</div>
            <div class="mini">• No planning ahead</div>
          </button>

          <button class="card chooseplan__plan" type="button" data-plan="pro">
            <div class="chooseplan__planTop">
              <div class="chooseplan__planInfo">
                <h3 class="chooseplan__planTitle">Pro</h3>
                <div class="mini">Week plan + push goals to Today</div>
              </div>
              <div class="chooseplan__price">
                <div class="chooseplan__priceValue">$4.99</div>
                <div class="mini chooseplan__priceUnit">/month</div>
              </div>
            </div>
            <div class="mini chooseplan__bullet">• This week + next 2 weeks</div>
            <div class="mini">• Up to 10 tasks/day</div>
          </button>

          <button class="card chooseplan__plan" type="button" data-plan="premium">
            <div class="chooseplan__planTop">
              <div class="chooseplan__planInfo">
                <h3 class="chooseplan__planTitle">Premium</h3>
                <div class="mini">Templates + month insights</div>
              </div>
              <div class="chooseplan__price">
                <div class="chooseplan__priceValue">$9.99</div>
                <div class="mini chooseplan__priceUnit">/month</div>
              </div>
            </div>
            <div class="mini chooseplan__bullet">• Up to 8 weeks ahead</div>
            <div class="mini">• Up to 15 tasks/day</div>
          </button>
        </div>

        <div class="mini" data-plan-toast style="display:none; margin-top:10px;"></div>
      </div>
    </div>
  </div>
</main>

<script src="../js/core/config.js" defer></script>
<script src="../js/cloud/supabase.js" defer></script>
<script src="../js/core/auth.js" defer></script>

<script src="../js/nav.js" defer></script>
<script src="../js/theme.js" defer></script>
<script src="../js/choose-plan.js" defer></script>
</body>
</html>

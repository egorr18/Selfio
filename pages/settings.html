<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Selfio</title>
  <meta name="description" content="Account and plan settings." />

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/app.css">
</head>

<body data-app data-page="settings">

<header class="header">
  <div class="container header__inner">
    <a href="../index.html" class="logo">Selfio</a>

    <nav class="nav">
      <a href="app.html">Today</a>
      <a href="weekly.html">Weekly</a>
      <a href="habits.html">Habits</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>

    <div class="header__actions">
      <span class="link" data-app-meta>—</span>
      <button class="btn btn--secondary" type="button" data-logout>Logout</button>
    </div>
  </div>
</header>

<section class="app">
  <div class="container">
    <div class="app__top">
      <div class="app__title">
        <h1>Settings</h1>
      </div>
    </div>

    <div class="card">
      <h2>Account</h2>
      <p class="mini">Email: <b data-email>—</b></p>
      <p class="mini">Plan: <b data-plan>—</b></p>

      <div class="actions">
        <a class="btn btn--secondary" href="pricing.html">See pricing</a>
        <button class="btn btn--primary" type="button" data-logout>Logout</button>
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <h2>What you unlock</h2>
      <div class="mini" data-plan-perks style="margin-top:6px;">—</div>

      <div class="actions" style="margin-top:12px;">
        <a class="btn btn--primary" href="choose-plan.html?pref=premium&next=settings.html">
          Upgrade
        </a>
        <a class="btn btn--secondary" href="weekly.html">
          Open Weekly
        </a>
      </div>
    </div>
  </div>
</section>

<script src="../js/app.js" defer></script>
</body>
</html>
